name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Strict build
        run: zensical build
      - name: House style
        run: python scripts/check-style.py
      - name: Interface coverage
        run: python scripts/check-interfaces.py
