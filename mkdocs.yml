# ForgeFIRM documentation site. Built by Zensical, which reads this file
# directly; mkdocs-material can build the same site from it unchanged.

site_name: ForgeFIRM
site_description: Open firmware for stock Glowforge lasers
site_url: https://docs.forgefirm.org/
repo_url: https://github.com/openglow-org/forgefirm-docs
repo_name: openglow-org/forgefirm-docs
edit_uri: edit/main/docs/
copyright: >-
  Copyright 2026 514 LLC d/b/a OpenGlow. Written by Scott Wiederhold.
  ForgeFIRM is an <a href="https://community.openglow.org">OpenGlow</a> project.
  Text licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
  Not affiliated with or endorsed by Glowforge.

strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.png
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [.]
      auto_append: [includes/abbreviations.md]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search

extra_css:
  - assets/stylesheets/forgefirm.css

extra:
  # The source revisions this site documents. scripts/check-interfaces.py reads
  # them, extracts every sysfs attribute, HTTP route and settings key at these
  # revisions, and fails on one the site does not name. Bump them alongside the
  # recipe pins.
  sources:
    kernel-module-glowforge: d8773e20b04469ca6efd5f36ad9c2101e75d60b4
    forgectrl: 24e136ef4970bfe55157299c46f65f0caeeb6419
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/openglow-org/forgefirm
      name: ForgeFIRM on GitHub
    - icon: fontawesome/solid/comments
      link: https://community.openglow.org
      name: Community forum

